<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Vocabulary Detective - 3D ESL Game</title>
  <style>
    body { margin: 0; overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    #game-container { width: 100vw; height: 100vh; }
    
    /* UI Dialogue Overlay */
    #dialogue-modal {
      display: none;
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: 80%;
      max-width: 600px;
      background: rgba(255, 255, 255, 0.95);
      border: 4px solid #4CAF50;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    }
    .npc-title { font-size: 1.2rem; font-weight: bold; color: #2E7D32; margin-bottom: 8px; }
    .dialogue-text { font-size: 1.1rem; color: #333; margin-bottom: 15px; }
    .option-btn {
      display: inline-block;
      margin: 5px;
      padding: 10px 18px;
      background: #2196F3;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.2s;
    }
    .option-btn:hover { background: #1976D2; }
    #feedback { font-weight: bold; margin-top: 10px; }
  </style>
  <!-- Three.js for 3D graphics -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <div id="game-container"></div>

  <!-- Dialogue & Question Box -->
  <div id="dialogue-modal">
    <div id="npc-name" class="npc-title">NPC Name</div>
    <div id="dialogue-text" class="dialogue-text">Dialogue goes here...</div>
    <div id="options-container"></div>
    <div id="feedback"></div>
  </div>

  <script>
    // Replace with your deployed Google Apps Script Web App URL
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz36lX8XOlvVQw_RYIFxiTC9zb_36L8Dr7kVsGenM_xJhEEJY28TBs_oRYvdBvHuvep/exec";
    
    let activeQuest = null;

    // --- 1. Fetch Quests from Google Apps Script ---
    async function fetchQuests() {
      try {
        const response = await fetch(`${https://script.google.com/macros/s/AKfycbz36lX8XOlvVQw_RYIFxiTC9zb_36L8Dr7kVsGenM_xJhEEJY28TBs_oRYvdBvHuvep/exec}?action=getQuests`);
        const quests = await response.json();
        console.log("Loaded Quests:", quests);
        // Start conversation with the first loaded quest (Barnaby the Baker)
        if (quests.length > 0) openDialogue(quests[0]);
      } catch (err) {
        console.error("Error connecting to Google Script backend:", err);
      }
    }

    // --- 2. Dialogue & Answer Handler ---
    function openDialogue(quest) {
      activeQuest = quest;
      document.getElementById("dialogue-modal").style.display = "block";
      document.getElementById("npc-name").innerText = `🔍 ${quest.npcName} (${quest.location})`;
      document.getElementById("dialogue-text").innerText = `${quest.dialogue.join(" ")}\n\n❓ ${quest.challenge.prompt}`;
      
      const container = document.getElementById("options-container");
      container.innerHTML = "";
      document.getElementById("feedback").innerText = "";

      quest.challenge.options.forEach(option => {
        const btn = document.createElement("button");
        btn.className = "option-btn";
        btn.innerText = option;
        btn.onclick = () => submitAnswer(option);
        container.appendChild(btn);
      });
    }

    async function submitAnswer(answer) {
      const feedbackEl = document.getElementById("feedback");
      feedbackEl.innerText = "Checking answer...";

      try {
        const response = await fetch(GOOGLE_SCRIPT_URL, {
          method: "POST",
          body: JSON.stringify({
            action: "submitAnswer",
            studentId: "Student_Year4_01",
            questId: activeQuest.questId,
            studentAnswer: answer,
            score: 100
          })
        });

        const result = await response.json();
        if (result.success) {
          feedbackEl.style.color = "green";
          feedbackEl.innerText = `🌟 ${result.feedback} Badge Earned: ${result.badge}`;
          setTimeout(() => {
            document.getElementById("dialogue-modal").style.display = "none";
          }, 2500);
        } else {
          feedbackEl.style.color = "red";
          feedbackEl.innerText = `❌ ${result.feedback} Hint: ${activeQuest.challenge.hint}`;
        }
      } catch (err) {
        feedbackEl.innerText = "Error connecting to server.";
      }
    }

    // --- 3. Simple 3D Environment (Three.js) ---
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87ceeb); // Sky blue
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.getElementById("game-container").appendChild(renderer.domElement);

    // Ground
    const groundGeometry = new THREE.PlaneGeometry(50, 50);
    const groundMaterial = new THREE.MeshBasicMaterial({ color: 0x7cfc00 }); // Grass green
    const ground = new THREE.Mesh(groundGeometry, groundMaterial);
    ground.rotation.x = -Math.PI / 2;
    scene.add(ground);

    // Player (Detective Robin - Red Cube)
    const playerGeometry = new THREE.BoxGeometry(1, 2, 1);
    const playerMaterial = new THREE.MeshBasicMaterial({ color: 0xe74c3c });
    const player = new THREE.Mesh(playerGeometry, playerMaterial);
    player.position.set(0, 1, 0);
    scene.add(player);

    // NPC (Barnaby the Baker - Blue Cylinder)
    const npcGeometry = new THREE.CylinderGeometry(0.8, 0.8, 2, 16);
    const npcMaterial = new THREE.MeshBasicMaterial({ color: 0x3498db });
    const npc = new THREE.Mesh(npcGeometry, npcMaterial);
    npc.position.set(0, 1, -5);
    scene.add(npc);

    camera.position.set(0, 4, 6);
    camera.lookAt(player.position);

    // Keyboard Controls
    window.addEventListener('keydown', (e) => {
      if (e.key === 'w' || e.key === 'ArrowUp') player.position.z -= 0.3;
      if (e.key === 's' || e.key === 'ArrowDown') player.position.z += 0.3;
      if (e.key === 'a' || e.key === 'ArrowLeft') player.position.x -= 0.3;
      if (e.key === 'd' || e.key === 'ArrowRight') player.position.x += 0.3;
      
      camera.position.x = player.position.x;
      camera.position.z = player.position.z + 6;

      // Detect proximity to NPC
      if (player.position.distanceTo(npc.position) < 2.5) {
        fetchQuests();
      }
    });

    function animate() {
      requestAnimationFrame(animate);
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
